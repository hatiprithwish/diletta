<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
@font-face{font-family:'Instrument Sans';font-weight:400;font-style:normal;font-display:swap;src:url('../../fonts/instrument-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:500;font-style:normal;font-display:swap;src:url('../../fonts/instrument-sans-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:600;font-style:normal;font-display:swap;src:url('../../fonts/instrument-sans-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-style:normal;font-display:swap;src:url('../../fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;font-style:normal;font-display:swap;src:url('../../fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2')}
</style>
<style>
body{margin:0;background:#FFFFFF}
a{color:#4D7C0F}a:hover{color:#171717}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #4D7C0F;outline-offset:2px}
</style>
</head>
<body>
<div style="width: 380px; height: 680px; font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif"><section aria-label="eRegister Assistant" style="width: 380px; height: 680px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 18px; box-shadow: 0 16px 40px rgba(0,0,0,0.10), 0 0 0 1px rgba(0,0,0,0.05); font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif; color: #171717; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px 18px">
<span style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-size: 14px; font-weight: 600; color: #171717; letter-spacing: -0.01em">eRegister Assistant</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6E6E6E"><span style="width: 6px; height: 6px; border-radius: 999px; background: #4D7C0F"></span>Online</span>
</span>
<button type="button" aria-label="New chat" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 8px; background: transparent; color: #4F4F4F; cursor: pointer"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"/></svg></button>
<button type="button" aria-label="Close assistant" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 8px; background: transparent; color: #4F4F4F; cursor: pointer"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg></button>
</div>
<div style="flex-grow: 1; overflow-y: auto; padding: 6px 18px 12px; display: flex; flex-direction: column; justify-content: center; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 22px; padding-bottom: 12px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #A3E635; color: #1A2E05; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v3M10 14v3M3 10h3M14 10h3M5.2 5.2l2 2M12.8 12.8l2 2M5.2 14.8l2-2M12.8 7.2l2-2"/></svg></span>
<h2 style="margin: 6px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Hi Priya, what do you need?</h2>
<p style="margin: 0; font-size: 14px; color: #4F4F4F; line-height: 1.5">I can answer questions about eRegister and update your records. I always show you a change before saving it.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 14px; border: 1px solid #EBEBEB; border-radius: 12px; background: #FFFFFF; color: #171717; font-size: 13.5px; text-align: left; cursor: pointer"><span style="color: #6E6E6E"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="5"/><path d="M13 13l3.5 3.5"/></svg></span>Which inspections are overdue?</button><button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 14px; border: 1px solid #EBEBEB; border-radius: 12px; background: #FFFFFF; color: #171717; font-size: 13.5px; text-align: left; cursor: pointer"><span style="color: #6E6E6E"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4l3.5 3.5-8 8H4.5V12l8-8z"/></svg></span>Close inspections finished this week</button><button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 14px; border: 1px solid #EBEBEB; border-radius: 12px; background: #FFFFFF; color: #171717; font-size: 13.5px; text-align: left; cursor: pointer"><span style="color: #6E6E6E"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 2.5h6l3.5 3.5v11.5h-9.5z"/><path d="M11.5 2.5V6H15"/></svg></span>How do I add a custom field?</button></div>
</div>
</div>
<div style="padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; padding: 5px 5px 5px 14px; border: 1px solid #EBEBEB; border-radius: 14px; background: #FFFFFF">
<label for="ask" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
<input id="ask" type="text" placeholder="Ask anything about your registers" value="" style="flex-grow: 1; min-width: 0; height: 34px; border: none; background: transparent; font-size: 14px; color: #171717; outline: none">
<button type="button" aria-label="Send" style="width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 10px; background: #A3E635; color: #1A2E05; cursor: pointer"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"/></svg></button>
</div>
<span style="padding: 0 4px; font-size: 11.5px; color: #6E6E6E">AI assistant. Changes to your data need your approval.</span>
</div>
</section></div>
</body>
</html>
