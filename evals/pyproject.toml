[project]
name = "diletta-evals"
version = "0.0.1"
description = "Diletta eval harness: case and result types generated from packages/schemas"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1,<3",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.87.0",
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diletta_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
