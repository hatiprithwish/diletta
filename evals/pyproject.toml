[project]
name = "diletta-evals"
version = "0.1.0"
description = "Diletta eval harness: drives /eval/* on a staging connection; types generated from packages/schemas"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pydantic>=2.14.1,<3",
    "pyjwt[crypto]==2.15.1",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.87.0",
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diletta_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
