name: Deploy Eval Runner (Production)

# DEV_NOTE: M7-9 (ADR 0007). The hosted eval runner (apps/eval-runner), a Python Worker vendoring evals/diletta_evals.
# It is deployed before the backend that binds its Workflow by script name (docs/runbooks/evals.md › Hosted runner); its
# EVAL_JWT_PRIVATE_KEY secret is set once per env with `pnpm exec wrangler secret put` in apps/eval-runner. bundle:fresh drops uv's cached
# build of the local evals package (cached by version), so every deploy vendors the code at this commit.
on:
  push:
    branches: [main]
    paths:
      - "apps/eval-runner/**"
      - "evals/diletta_evals/**"
      - "evals/pyproject.toml"
      - "evals/uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-eval-runner-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy eval runner to Cloudflare Workers (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        working-directory: apps/eval-runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          uv sync --locked
          pnpm run deploy:production
