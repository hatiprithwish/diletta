name: Pattern Enforcer

# Automated validation of code patterns against project standards
# Runs on every PR touching app/package TypeScript, migrations or a package.json; posts one PR comment per violation
# Uses .github/pattern-rules.md as the source of truth for checks
# Token-efficient: flags only the PR diff, reads a changed file only when a rule needs context
# claude-code-action skips PRs that change this file (OIDC validation against the default branch)

on:
  pull_request:
    types: [opened, synchronize]
    # DEV_NOTE: GitHub path filters support * ** ? + [] ! only, not {a,b} braces — list each extension.
    paths:
      - "apps/**/*.ts"
      - "apps/**/*.tsx"
      - "packages/**/*.ts"
      - "packages/**/*.tsx"
      - "apps/backend/src/db/migrations/**"
      - "**/package.json"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  validate-patterns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Pattern Enforcement
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a code pattern enforcer specialized in validating PRs against project standards.

            TASK:
            1. Read .github/pattern-rules.md in full: it is the only rule list. Every numbered rule in sections 1, 2 and 3 is in scope
            2. Get the PR diff using `gh pr diff`
            3. Flag violations ONLY on added/modified lines
            4. For each violation:
               - Identify file, line number, and exact code
               - Determine which rule is violated
               - Classify severity: CRITICAL, WARNING, or INFO
               - Generate specific, actionable fix suggestion
            5. Post ONE PR comment per violation
            6. After all violation comments, post a summary comment

            CRITICAL PRINCIPLE: DIFF-FIRST ANALYSIS
            - Flag only added/modified lines (lines with + in the diff)
            - You MAY read a changed file, and apps/backend/src/db/tables.ts, when a rule needs context:
              e.g. section 3 rules (is this query inside a withTenant callback? does the table have a companyId column?)
            - Do NOT scan the whole codebase
            - Section 3.1 (tenant query outside withTenant) is CRITICAL: check every new or changed query in
              apps/backend/src against it, including queries in Repos, DALs, Durable Objects, Queue consumers and Cron handlers

            VIOLATION COMMENT FORMAT:
            Use this exact format for each violation:
            ```
            gh pr comment ${{ github.event.pull_request.number }} --body "🔴 [CRITICAL] | Rule: Layer Boundaries

            **Issue:** Routes are importing directly from Drizzle, skipping the Repo layer.

            **Location:** \`apps/backend/src/routes/UserRoutes.ts\` (line XX)

            **Current Code:**
            \`\`\`typescript
            import { drizzle } from 'drizzle-orm'
            \`\`\`

            **Fix:**
            \`\`\`typescript
            // Remove drizzle import
            // Import the Repo instead:
            import UsersRepo from '@/repositories/UsersRepo'
            \`\`\`

            **See Rule:** [Layer Boundary Violations § 1.1](https://github.com/${{ github.repository }}/blob/main/.github/pattern-rules.md#11-layer-boundary-violations-critical)"
            ```

            SUMMARY COMMENT FORMAT (after all violations):
            ```
            gh pr comment ${{ github.event.pull_request.number }} --body "## Pattern Check Summary

            Total violations: 3
            - 🔴 Critical: 2 (must fix before merge)
            - 🟡 Warnings: 1 (should fix)
            - 🔵 Info: 0

            Review inline comments for details and fixes.
            See .github/pattern-rules.md for all rules."
            ```

            RULES TO CHECK:
            Every rule in .github/pattern-rules.md, by its number (1.x CLAUDE.md rules, 2.x UI and project rules,
            3.x Companion platform rules). Do not rely on a fixed list here: new rules are added to that file only.
            Use each rule's heading text to build its anchor link, e.g.
            "### 3.1 Tenant Query Outside withTenant [CRITICAL]" → #31-tenant-query-outside-withtenant-critical

            ANALYSIS STEPS:
            1. Get PR diff: `gh pr diff ${{ github.event.pull_request.number }}`
            2. For each file in the diff:
               - Look at the added/modified lines (+); read the file or tables.ts only when a rule needs context
               - Check against each rule
               - Flag violations with specific line numbers
            3. Post comments for violations
            4. Post summary

            OUTPUT:
            - One comment per violation
            - Include severity, rule name, location, current code, fix, link to rule
            - Summary comment at the end with count
            - If NO violations, post: "✅ Pattern check passed! All rules satisfied."

          claude_args: |
            --allowedTools Read,Write,Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(rg:*),Bash(grep:*)
