name: Evals Contract

# DEV_NOTE: The contract between packages/schemas and the Python harness (M5-1): the committed JSON Schema files and
# samples match the Zod schemas (vitest drift tests), the generated Pydantic types match the JSON Schema files, and
# the Pydantic types accept and refuse the same samples as Zod (pnpm evals:check).
on:
  pull_request:
    paths:
      - "packages/schemas/**"
      - "evals/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/evals-contract.yml"

permissions:
  contents: read

concurrency:
  group: evals-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Zod ↔ JSON Schema ↔ Python types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Schemas tests (JSON Schema and samples drift)
        run: pnpm --filter @app/schemas test

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: evals

      - name: Install the harness
        run: uv sync --project evals --locked

      - name: Python types match evals/schemas/, and accept and refuse the same samples
        run: pnpm evals:check
