name: Deploy Widget (Staging)

on:
  push:
    branches: [staging]
    paths:
      - "apps/widget/**"
      - "packages/ui/**"
      - "packages/schemas/**"
      - "pnpm-lock.yaml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: deploy-widget-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy widget bundle to Cloudflare Workers (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DEV_NOTE: Also enforces the bundle budget (scripts/checkBundleSize.ts): an oversized bundle never deploys
      - name: Build
        run: pnpm --filter widget build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/widget
          command: deploy --env staging
